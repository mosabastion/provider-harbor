apiVersion: harbor.m.crossplane.io/v1beta1
kind: Registry
metadata:
  name: uptest-repl-registry
  namespace: uptest
  annotations:
    meta.upbound.io/example-id: harbor/v1beta1/registry
spec:
  forProvider:
    name: uptest-repl-registry
    type: docker-hub
    url: https://hub.docker.com
  providerConfigRef:
    kind: ProviderConfig
    name: harbor-e2e
---
apiVersion: harbor.m.crossplane.io/v1beta1
kind: Replication
metadata:
  name: uptest-replication
  namespace: uptest
  annotations:
    meta.upbound.io/example-id: harbor/v1beta1/replication
spec:
  forProvider:
    name: uptest-replication
    # Pull-mode: source is the named registry above. destinationReg has no
    # name, so the destination is the local Harbor; namespace still targets
    # the destination project.
    sourceRegistry: uptest-repl-registry
    destinationReg:
      namespace: uptest
    trigger: manual
    enabled: true
    filters:
      - type: repository
        value: "**"
  providerConfigRef:
    kind: ProviderConfig
    name: harbor-e2e
